name: Build assets
description: Minify every assets/js/*.js and assets/css/*.css with the pinned terser and clean-css. Run npm ci first.
runs:
  using: composite
  steps:
    - name: Minify JS and CSS
      shell: bash
      run: |
        set -eu
        node - <<'NODE'
        const fs = require('fs');
        const { minify } = require('terser');
        const CleanCSS = require('clean-css');
        (async () => {
          for (const type of ['js', 'css']) {
            const directory = 'assets/' + type + '/';
            for (const file of fs.readdirSync(directory).sort()) {
              if (!file.endsWith('.' + type) || file.endsWith('.min.' + type)) continue;
              const source = fs.readFileSync(directory + file, 'utf8');
              const result = type === 'js'
                ? await minify(source, { compress: true, mangle: true, format: { comments: false } })
                : new CleanCSS({ level: 2 }).minify(source);
              if (result.errors && result.errors.length) throw new Error(result.errors.join('\n'));
              const output = (result.code ?? result.styles) + '\n';
              fs.writeFileSync(directory + file.replace('.' + type, '.min.' + type), output);
              console.log(file + ': ' + Buffer.byteLength(source) + ' -> ' + Buffer.byteLength(output) + ' bytes');
            }
          }
        })().catch(error => { console.error(error); process.exit(1); });
        NODE
    - name: Check minified files
      shell: bash
      run: |
        set -eu
        for file in assets/js/*.min.js assets/css/*.min.css; do
          test -s "$file"
        done
        for file in assets/js/*.min.js; do
          node --check "$file"
        done
