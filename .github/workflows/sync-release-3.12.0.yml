name: Synchronize release 3.12.0
on:
  push:
    branches: ['release/3.12.0']
    paths: ['.github/workflows/sync-release-3.12.0.yml']
permissions:
  contents: read
concurrency:
  group: sync-release-3.12.0
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'gemuzkm/multi-level-category-menu' && github.ref == 'refs/heads/release/3.12.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the reviewed starting point
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 7bcb3a7a997287e14561a0d13b49da9281d66b81
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/sync-release-3.12.0.yml
          test "$(git hash-object multi-level-category-menu.php)" = a2e81cad46afead58e208d8277433ca2b74e8103
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Synchronize PHP version and audit every tracked file
        shell: python
        run: |
          import json, pathlib, re, subprocess
          target = '3.12.0'
          php = pathlib.Path('multi-level-category-menu.php')
          original = php.read_bytes()
          replacements = original.count(b'3.11.0')
          if replacements == 0:
              raise SystemExit('Expected old PHP version was not found.')
          php.write_bytes(original.replace(b'3.11.0', target.encode()))
          package = json.loads(pathlib.Path('package.json').read_text())
          lock = json.loads(pathlib.Path('package-lock.json').read_text())
          block = json.loads(pathlib.Path('assets/js/block.json').read_text())
          readme = pathlib.Path('readme.md').read_text()
          readme_version = re.search(r'^Version:\s*\*\*([^*]+)\*\*\s*$', readme, re.M)
          php_version = re.search(rb'^Version:\s*(\S+)\s*$', php.read_bytes(), re.M)
          versions = [package['version'], lock['version'], lock['packages']['']['version'], block['version'], readme_version.group(1) if readme_version else None, php_version.group(1).decode() if php_version else None]
          if any(value != target for value in versions):
              raise SystemExit('Release metadata mismatch: ' + repr(versions))
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0')
          old = re.compile(r'(?<![\w.])v?3\.(?:[0-9]|10|11)\.\d+(?![\w.])')
          semver = re.compile(r'(?<![\w.])v?\d+\.\d+\.\d+(?![\w.])')
          report = [f'Target version: {target}', f'Tracked files inspected: {len(paths)}', f'PHP version replacements: {replacements}', '', 'Version references by file:']
          problems = []
          for name in paths:
              data = pathlib.Path(name).read_bytes()
              if b'\0' in data:
                  report.append(name + ': binary; no text replacement')
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  raise SystemExit('Cannot audit non-UTF-8 file: ' + name)
              found = sorted(set(semver.findall(text)))
              report.append(name + ': ' + (', '.join(found) if found else 'no semantic versions'))
              if name in ('package.json', 'package-lock.json', '.github/workflows/sync-release-3.12.0.yml'):
                  continue
              history = False
              for number, line in enumerate(text.splitlines(), 1):
                  if name == 'readme.md' and line.strip() == '## Changelog':
                      history = True
                  if not history and old.search(line):
                      problems.append(f'{name}:{number}: {line.strip()}')
          report += ['', 'Historical changelog entries and dependency versions are preserved.']
          if problems:
              raise SystemExit('Unexpected older version references require review:\n' + '\n'.join(problems) + '\n\n' + '\n'.join(report))
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          if changed != ['multi-level-category-menu.php']:
              raise SystemExit('Unexpected changes: ' + repr(changed))
          pathlib.Path('/tmp/mlcm-version-audit.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
      - name: Validate release metadata and PHP syntax
        run: |
          set -eu
          node scripts/package.mjs --check
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l
          git diff --check
      - name: Commit locally for clean-tree packaging tests
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- multi-level-category-menu.php
          git commit -m 'chore: synchronize remaining PHP versions to 3.12.0' -m "$(cat /tmp/mlcm-version-audit.txt)"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- assets/
      - run: npm test
      - run: npm run package
      - name: Push only to the unchanged release branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REMOTE: ${{ github.sha }}
        run: |
          set -eu
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin refs/heads/release/3.12.0
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_REMOTE"
          test -z "$(git status --porcelain --untracked-files=no)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/release/3.12.0
