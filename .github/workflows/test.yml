name: Plugin tests and release
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Check versions and release target
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          PHP=$(sed -nE 's/^Version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' multi-level-category-menu.php | head -n1)
          README=$(sed -nE 's/^Version:[[:space:]]*\*\*([^*]+)\*\*[[:space:]]*$/\1/p' readme.md | head -n1)
          PACKAGE=$(node -p "require('./package.json').version")
          LOCK=$(node -p "const l = require('./package-lock.json'); l.version === l.packages[''].version ? l.version : 'mismatch'")
          BLOCK=$(node -p "require('./assets/js/block.json').version")
          echo "php=$PHP readme=$README package=$PACKAGE lock=$LOCK block=$BLOCK"
          if ! grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<<"$PHP"; then
            echo "::error::The PHP plugin header must contain a stable X.Y.Z version."
            exit 1
          fi
          for value in "$README" "$PACKAGE" "$LOCK" "$BLOCK"; do
            if [ "$value" != "$PHP" ]; then
              echo "::error::Version mismatch: PHP header, README, package.json, package-lock.json and block.json must share one X.Y.Z version."
              exit 1
            fi
          done
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$PHP" ]; then
              echo "::error::Expected tag v$PHP; received $REF_NAME. Only stable vX.Y.Z tags are supported."
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$PHP" >> "$GITHUB_OUTPUT"
  assets:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-assets
      - run: git diff --exit-code -- assets/
      - run: npm test
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.validate.outputs.version }}
  wordpress:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '5.8'
          - php: '8.2'
            wordpress: '6.3'
          - php: '8.3'
            wordpress: 'latest'
          - php: '8.4'
            wordpress: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          tools: wp-cli
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Install isolated WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          wp core download --path=/tmp/wordpress --version="$WP_VERSION"
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=password --dbhost=127.0.0.1
          wp core install --path=/tmp/wordpress --url=http://localhost --title=Tests --admin_user=admin --admin_password=test-only-password --admin_email=test@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/multi-level-category-menu
          wp plugin activate multi-level-category-menu --path=/tmp/wordpress
      - name: Integration tests on real WordPress APIs
        env:
          MLCM_TEST_ENV: '1'
        run: |
          wp eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path=/tmp/wordpress
          for mode in blank early late widget block; do
            wp eval-file "$GITHUB_WORKSPACE/tests/assets.php" "$mode" --path=/tmp/wordpress
          done
          wp eval-file "$GITHUB_WORKSPACE/tests/uninstall.php" --path=/tmp/wordpress
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [validate, assets, wordpress]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/build-assets
      - run: git diff --exit-code -- assets/
      - name: Require the release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.validate.outputs.version }}
      - name: Publish release with ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists. Existing releases are never overwritten."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/multi-level-category-menu-${RELEASE_TAG#v}.zip" \
            "dist/multi-level-category-menu-${RELEASE_TAG#v}.zip.sha256" \
            --verify-tag \
            --title "Multi-Level Category Menu ${RELEASE_TAG#v}" \
            --generate-notes
